# Labels pull requests by the areas they touch (.github/labeler.yml), so
# reviews and release notes can be filtered by area.
#
# pull_request_target runs in the base repository's context so a PR from a
# fork can be labeled. That is safe here only because this workflow never
# checks out or runs the PR's code: actions/labeler reads the changed file
# list through the API. Never add a checkout of the PR head to this file.
#
# It runs when a PR opens, reopens or leaves draft, not on every push: the
# run is cheap but queues behind the org's job cap, and labels follow the
# areas a PR touches, which rarely change after it opens. A label that goes
# stale is fixed by closing and reopening the PR.
name: labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no PR code is checked out or run
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # add and remove the PR's area labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
