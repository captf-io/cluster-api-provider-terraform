# OpenSSF Scorecard: supply-chain security posture (pinned dependencies,
# token permissions, branch protection, signed releases, ...). Results go to
# code scanning and, for a public repository, to the public Scorecard API
# behind the README badge.
#
# With publish_results the workflow may only use approved actions and must
# not set top-level write permissions; keep it minimal.
#
# Scorecard cannot read a private repository with the workflow token, so
# the job runs only when the repository variable SCORECARD is "true": set
# it once the repository is public.
#
# It runs weekly, on demand and when branch protection changes, not on every
# push: the posture it scores moves slowly, and each run queues a job.
name: scorecard

on:
  schedule:
    - cron: "43 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    if: ${{ vars.SCORECARD == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results (publish_results)
      contents: read
      actions: read # read workflow runs for the CI-Tests and SAST checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.event.repository.private == false }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
