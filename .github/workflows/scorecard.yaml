# OpenSSF Scorecard: supply-chain security posture (pinned dependencies,
# token permissions, branch protection, signed releases, ...). Results go to
# code scanning and, for a public repository, to the public Scorecard API
# behind the README badge.
#
# With publish_results the workflow may only use approved actions and must
# not set top-level write permissions; keep it minimal.
#
# Scorecard cannot read a private repository with the workflow token, so
# the job runs only when the repository variable SCORECARD is "true": set
# it once the repository is public.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    if: ${{ vars.SCORECARD == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results (publish_results)
      contents: read
      actions: read # read workflow runs for the CI-Tests and SAST checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.event.repository.private == false }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
