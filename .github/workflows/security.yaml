# Security and supply-chain scanning. Every scanner both gates (fails the
# job on findings) and, where it speaks SARIF, uploads its results to the
# repository's code scanning alerts (Security tab), so findings show up on
# the PR diff and stay tracked on main.
#
# Two tiers, so a PR queues two jobs rather than a dozen:
#
#   every event (PRs, main, weekly, on demand): one job, "checks", that
#   shares a checkout and a Go setup between its scanners:
#     gitleaks          secrets in the full git history (.gitleaks.toml)
#     govulncheck       known Go vulnerabilities reachable from our code
#     trivy             rendered manifests (misconfig) and the repo (vulns,
#                       secrets); exceptions in .trivyignore.yaml
#     zizmor, actionlint  Actions security, workflow syntax and shell
#     dependency review   new dependencies in a PR (vulnerable or malicious)
#   plus osv-scanner: the PR variant reports only vulnerabilities the PR
#   introduces, the full variant covers every lockfile (go.mod, go.sum).
#
#   push to main, weekly and on demand only (slow, and they scan what a PR
#   cannot change on its own):
#     codeql            semantic analysis of the Go code (security-and-quality)
#     gosec             Go security lint; reviewed findings carry #nosec
#     container         per image (manager, tfcapi-lint): hadolint, a
#                       multi-arch buildx build, a Trivy image scan and an
#                       SPDX SBOM
#
# The weekly run finds new advisories against unchanged code. SARIF uploads
# are skipped for PRs from forks, whose token cannot write security events.
#
# Code scanning (SARIF uploads, CodeQL) and dependency review need GitHub
# Advanced Security on a private repository; on a public one they are
# free. They run only when the repository variable ADVANCED_SECURITY is
# "true" (Settings > Secrets and variables > Actions > Variables). Without
# it every scanner still runs and still fails the job on findings; only
# the uploads, CodeQL and dependency review are skipped.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: auto
  # True when this run may upload SARIF: code scanning is available and the
  # run is not a PR from a fork.
  CAN_UPLOAD: ${{ vars.ADVANCED_SECURITY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  # The cheap scanners in one job. Every step after the first runs even when
  # an earlier one failed, so one finding never hides another; the job still
  # fails if any step did.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the
      # release's checksums file; bump both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz, from
      # the release's checksums file; bump both together.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Full history for gitleaks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum

      # The binary, not gitleaks-action: the action needs a paid license for
      # organization repositories.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      # Every commit on every fetched ref; findings are redacted in the log.
      - name: gitleaks (git history)
        if: ${{ !cancelled() }}
        run: >-
          gitleaks git --config .gitleaks.toml --redact --verbose
          --log-opts=--all
          --report-format sarif --report-path gitleaks.sarif .
      - name: Upload SARIF (gitleaks)
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      # One install for both modules. The Go setup above honors go.mod's
      # toolchain directive: results depend on the exact Go patch release
      # (standard library advisories).
      - name: Install govulncheck
        if: ${{ !cancelled() }}
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck (root module)
        if: ${{ !cancelled() }}
        run: govulncheck ./...
      - name: govulncheck (api module)
        if: ${{ !cancelled() }}
        run: govulncheck -C api ./...

      # Scan what clusterctl installs, not the kustomize fragments under
      # config/: a strategic-merge patch alone lacks the securityContext
      # the base Deployment sets.
      - name: Render the infrastructure components
        if: ${{ !cancelled() }}
        run: >-
          make manifests-release RELEASE_DIR=out/scan
          RELEASE_IMG=ghcr.io/captf-io/cluster-api-provider-terraform:v0.0.0-ci
      # SARIF holds every severity; the job fails on HIGH and CRITICAL.
      - name: Misconfigurations (rendered manifests)
        if: ${{ !cancelled() && hashFiles('out/scan/infrastructure-components.yaml') != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: out/scan/infrastructure-components.yaml
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Vulnerabilities and secrets (repository)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: out,bin,cmd/tfcapi-lint/testdata,internal/jobs/testdata,internal/state/testdata/fixtures
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
      - name: Upload SARIF (manifests)
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' && hashFiles('trivy-config.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Upload SARIF (repository)
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Template injection, excessive permissions, unpinned actions,
      # credential persistence and dangerous triggers.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: ${{ env.CAN_UPLOAD == 'true' }}
      # Workflow syntax, expressions and (through the runner's shellcheck)
      # the shell in run steps.
      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      # Fails a PR that adds a dependency with a moderate or worse advisory,
      # or a known-malicious package; the summary lists every change.
      - name: Dependency review
        if: ${{ !cancelled() && github.event_name == 'pull_request' && vars.ADVANCED_SECURITY == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          show-openssf-scorecard: true

  osv-scanner:
    name: osv-scanner
    # The reusable workflow uploads SARIF itself; the PR variant reports
    # only vulnerabilities the PR introduces.
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      actions: read # read this run's workflow metadata for the SARIF upload
      security-events: write # upload SARIF to code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      upload-sarif: ${{ vars.ADVANCED_SECURITY == 'true' }}
      scan-args: |-
        --recursive
        ./

  osv-scanner-pr:
    name: osv-scanner (PR)
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read # read this run's workflow metadata for the SARIF upload
      security-events: write # upload SARIF to code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      upload-sarif: ${{ vars.ADVANCED_SECURITY == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
      scan-args: |-
        --recursive
        ./

  codeql:
    name: codeql
    # CodeQL results exist only in code scanning. Not on PRs: the build and
    # analysis take minutes, and main and the weekly run cover every change.
    if: ${{ github.event_name != 'pull_request' && vars.ADVANCED_SECURITY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # read this run's workflow metadata for the SARIF upload
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          # Go has no build-mode "none" in the pinned action (v4.38.2,
          # bundle 2.27.1): the extractor needs the build.
          build-mode: manual
          queries: security-and-quality
      # Both workspace modules and every binary, then every test package
      # (compiled, not run) so the extractor sees _test.go code too. This job
      # runs on main and weekly only, so the cost is off the PR path.
      - name: Build
        run: |
          go build ./... ./api/...
          go test -count=1 -run '^$' ./... ./api/... >/dev/null
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go

  gosec:
    name: gosec
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      GOSEC_VERSION: 2.29.0
      # sha256 of gosec_${GOSEC_VERSION}_linux_amd64.tar.gz, from the
      # release's checksums file; bump both together.
      GOSEC_SHA256: 6431b119741c1f4a50fdfcf94e782e16b9e642afc8c7fa9b5d39d48bf3003095
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
      # The release binary, not `go install`: no source build of gosec.
      - name: Install gosec
        run: |
          tarball="gosec_${GOSEC_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/securego/gosec/releases/download/v${GOSEC_VERSION}/${tarball}"
          echo "${GOSEC_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gosec
          echo "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
      # hack/ holds developer tools that never ship. Reviewed findings in
      # shipped code carry an inline "#nosec G<rule> -- reason".
      - name: gosec
        run: >-
          gosec -exclude-dir=hack -exclude-generated
          -fmt=sarif -out=gosec.sarif -stdout -verbose=text
          ./... ./api/...
      - name: Upload SARIF
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gosec.sarif
          category: gosec

  container:
    name: container image (${{ matrix.name }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        # name is the Dockerfile target and the buildx cache scope (the
        # one publish.yaml reads); the manager keeps its original SARIF
        # category so its alert history carries on.
        include:
          - name: manager
            image: ghcr.io/captf-io/cluster-api-provider-terraform:ci
            category: trivy-image
          - name: tfcapi-lint
            image: ghcr.io/captf-io/tfcapi-lint:ci
            category: trivy-image-tfcapi-lint
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .hadolint.yaml holds the shared configuration.
      - name: hadolint (Dockerfile)
        if: ${{ matrix.name == 'manager' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both release platforms: the build stage cross-compiles, so arm64
      # needs no emulation. Nothing is pushed. The cache scope is shared
      # with publish.yaml, which only reads it: this job runs on trusted
      # refs only, never on a PR, so nothing untrusted writes the cache.
      # mode=max, because the layer worth caching (the module download) is
      # in the build stage, which mode=min leaves out.
      - name: Build (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Load linux/amd64 for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.name }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload SARIF (image)
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: ${{ matrix.category }}
      - name: SBOM (SPDX)
        if: ${{ !cancelled() }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          artifact-name: ${{ matrix.name }}-image.spdx.json
          upload-release-assets: false

  ok:
    name: ok
    if: ${{ always() }}
    needs: [checks, osv-scanner, osv-scanner-pr, codeql, gosec, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # A job skipped by its event filter (the PR-only, push-only and
      # non-PR variants) or by ADVANCED_SECURITY being unset counts as
      # passing.
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [[ "${r}" != "success" && "${r}" != "skipped" ]]; then
              echo "::error::a required job finished with '${r}'"
              exit 1
            fi
          done
