# Publishing: two images to GHCR, built from the Dockerfile's two targets,
# and GitHub Releases.
#
#   manager      ghcr.io/captf-io/cluster-api-provider-terraform (manager
#                and runner, one image)
#   tfcapi-lint  ghcr.io/captf-io/tfcapi-lint (the linter alone; the
#                actions/tfcapi-lint GitHub Action runs it)
#
#   ci passed on main both images :edge and :sha-<7-char commit>
#   push tag v*.*.*   both images :vX.Y.Z, a check that both tags exist at
#                     the pushed digests, then a GitHub Release (a
#                     pre-release for vX.Y.Z-rc.N) with the clusterctl
#                     assets (infrastructure-components.yaml, metadata.yaml,
#                     templates) and the tfcapi-lint binaries and checksums;
#                     its notes come from hack/release-notes.sh
#
# Nothing is published from a commit whose ci failed:
#
#   main      the workflow_run trigger fires when ci completes; the gate job
#             accepts only a successful ci run caused by a push to main of
#             this repository, and everything below builds that run's
#             head_sha, not whatever main has moved to. :edge moves only
#             while that commit is still main HEAD, so a slow ci cannot
#             move :edge backwards; :sha-<7> is always published.
#   tag       the gate job requires a successful ci push run on main for
#             the tagged commit (hack/require-ci.sh), waiting up to 30
#             minutes for one that is still running. So a release tag goes
#             on a commit that was main HEAD and green.
#   dispatch  republishes :edge and :sha-<7> from main HEAD, after the same
#             ci check as a tag.
#
# `make release-ci-check` runs that check locally.
#
# The action's image follows its ref (actions/tfcapi-lint/tfcapi-lint.sh):
# a release tag runs :vX.Y.Z, a commit on main :sha-<7>, main :edge. A
# commit that was never a pushed main HEAD with a green ci run has no
# :sha-<7>; the action's version and image inputs are the way around that.
#
# Images are linux/amd64 and linux/arm64; the Dockerfile cross-compiles, so
# no emulation. A tag must pass `make release-preflight` (vX.Y.Z or
# vX.Y.Z-rc.N, metadata.yaml append-only) before anything is pushed for it.
# workflow_dispatch republishes :edge from main; tags are published only by
# their push, so a released image tag never moves.
#
# The keyless signature and the attestations name this workflow at
# refs/heads/main (a workflow_run job runs the default branch's workflow),
# not the built commit; the image's org.opencontainers.image.revision label
# and its :sha-<7> tag carry the commit.
#
# Every pushed image digest gets a keyless cosign signature (GitHub OIDC),
# a SLSA build-provenance attestation and an SPDX SBOM attestation, both
# pushed to the registry. Every release asset gets a provenance attestation,
# whose bundle is also uploaded as provenance.intoto.jsonl (OpenSSF
# Scorecard's Signed-Releases check). Verify:
#
#   cosign verify ghcr.io/captf-io/cluster-api-provider-terraform:edge \
#     --certificate-identity-regexp '^https://github.com/captf-io/cluster-api-provider-terraform/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/captf-io/cluster-api-provider-terraform:edge \
#     -R captf-io/cluster-api-provider-terraform
#   (the same for ghcr.io/captf-io/tfcapi-lint, still -R this repository)
#   gh attestation verify infrastructure-components.yaml \
#     -R captf-io/cluster-api-provider-terraform
#
# (add --predicate-type https://spdx.dev/Document/v2.3 for the SBOM).
#
# After the first push of each image, set the GHCR package's visibility to
# public once (github.com/orgs/captf-io/packages > <package> > Package
# settings): a new organization package may default to private.
#
# Each image build reads, and never writes, the buildx cache scope (one per
# image) that the security workflow fills on main: only trusted refs write
# it (security builds the images on main, the weekly schedule and manual
# runs, never on a PR), so an untrusted run cannot poison a published image. A miss only
# costs time. The release job uses no module or build cache.
name: publish

on:
  push:
    tags: ["v*.*.*"]
  # Safe despite zizmor's dangerous-triggers rule: the gate job accepts only a
  # successful ci run caused by a push to main of this repository (never a
  # pull request, a fork or a schedule), the code built is that run's
  # head_sha, and no value from the event reaches a shell unquoted.
  workflow_run: # zizmor: ignore[dangerous-triggers] only successful push-to-main ci runs are accepted, see the gate job
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# Never cancel a publish halfway: a pushed but unsigned image, or a tag
# without its release, is worse than a late one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto
  # The Makefile's RELEASE_REPO; the release pins the components to it.
  IMAGE: ghcr.io/captf-io/cluster-api-provider-terraform

jobs:
  # Decides whether to publish, and which commit. Never from a fork; a
  # successful push-to-main ci run, a manual run on main, or a pushed tag.
  gate:
    name: gate
    if: >-
      github.repository == 'captf-io/cluster-api-provider-terraform' &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 45 # up to 30 minutes of waiting for ci on a tag
    permissions:
      contents: read
      actions: read # list the ci runs of the commit
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The commit to publish: the ci run's head_sha, else the pushed or
      # dispatched one. github.sha on a workflow_run is main's latest commit,
      # which is not necessarily the one ci tested.
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      edge: ${{ steps.resolve.outputs.edge }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      # A workflow_run is already a green ci run; a tag and a dispatch are
      # checked against the commit's runs.
      - name: Require green CI
        if: ${{ github.event_name != 'workflow_run' }}
        run: hack/require-ci.sh "${SOURCE_SHA}"
      # :edge follows main HEAD only: an older commit's ci finishing late
      # still gets its :sha-<7> but must not move :edge back.
      - name: Resolve
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a commit: '${SOURCE_SHA}'"
            exit 1
          fi
          edge=false
          case "${EVENT}" in
            workflow_dispatch) edge=true ;;
            workflow_run)
              head="$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)"
              [[ "${head}" == "${SOURCE_SHA}" ]] && edge=true
              ;;
          esac
          {
            echo "sha=${SOURCE_SHA}"
            echo "short=${SOURCE_SHA:0:7}"
            echo "edge=${edge}"
          } >>"${GITHUB_OUTPUT}"

  image:
    name: image (${{ matrix.name }})
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless cosign signing and attestations (OIDC)
      attestations: write # store the provenance and SBOM attestations
    # No fail-fast: cancelling the other image mid-push is worse than
    # finishing it. The release needs both.
    strategy:
      fail-fast: false
      matrix:
        include:
          # name is the Dockerfile target and the buildx cache scope.
          - name: manager
            image: ghcr.io/captf-io/cluster-api-provider-terraform
            description: Cluster API Provider Terraform manager and Job runner
          - name: tfcapi-lint
            image: ghcr.io/captf-io/tfcapi-lint
            description: tfcapi-lint, the CAPTF module and module image linter
    env:
      IMAGE: ${{ matrix.image }}
    # A matrix job's outputs merge across its legs; each leg sets only the
    # key named after it (the Digest step), and the release reads the
    # manager's.
    outputs:
      manager-digest: ${{ steps.digest.outputs.manager }}
      lint-digest: ${{ steps.digest.outputs.tfcapi-lint }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Full history and tags: hack/version.sh describes HEAD from the
      # newest tag, and release-preflight reads the previous metadata.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # check-metadata.sh needs PyYAML (hack/ci/requirements.txt).
      - if: ${{ github.ref_type == 'tag' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Release preflight
        if: ${{ github.ref_type == 'tag' }}
        run: |
          python3 -m pip install --require-hashes -r hack/ci/requirements.txt
          make release-preflight VERSION="${GITHUB_REF_NAME}"
      # The same GO_VERSION and LDFLAGS as `make docker-build`; a tag build
      # is stamped with the tag itself.
      - name: Build arguments
        id: args
        run: |
          version=()
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version=("VERSION=${GITHUB_REF_NAME}")
          fi
          {
            echo "go-version=$(make -s --no-print-directory print-GO_VERSION)"
            echo "ldflags=$(make -s --no-print-directory print-LDFLAGS "${version[@]}")"
          } >>"${GITHUB_OUTPUT}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # edge and sha-<7> for main, the tag itself for a tag; never
      # "latest". The OCI labels and annotations (source, revision,
      # version, licenses) link the GHCR package to this repository.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # The tags are computed, not the action's edge and sha types: on a
          # workflow_run they would name main's latest commit, not the one
          # ci passed.
          tags: |
            type=raw,value=edge,enable=${{ needs.gate.outputs.edge == 'true' }}
            type=raw,value=sha-${{ needs.gate.outputs.short }},enable=${{ github.ref_type != 'tag' }}
            type=ref,event=tag
          # GitHub reads LICENSE.md's styled Markdown as "Other", so the
          # repository metadata would give NOASSERTION and no description.
          labels: |
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=${{ matrix.description }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # buildx's own provenance and SBOM are off: both are attested below,
      # signed and stored with GitHub's attestations.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GO_VERSION=${{ steps.args.outputs.go-version }}
            LDFLAGS=${{ steps.args.outputs.ldflags }}
      - name: Digest
        id: digest
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${NAME}=${DIGEST}" >>"${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # The storage record would need artifact-metadata: write; the
      # attestation alone is what verification reads.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.name }}-image.spdx.json
          artifact-name: ${{ matrix.name }}-image.spdx.json
          upload-release-assets: false
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.name }}-image.spdx.json
          push-to-registry: true

  release:
    name: release
    needs: image
    if: >-
      github.repository == 'captf-io/cluster-api-provider-terraform' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload its assets
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # store the provenance attestation
      packages: read # read the pushed image tags back
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Full history and tags: GoReleaser builds from the tag, and
      # release-notes lists the commits since the previous one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Both images must carry :vX.Y.Z, and exactly the digests the image
      # job pushed and signed (v0.1.0 had no tfcapi-lint image). Nothing is
      # released until they do.
      - name: Check the image tags
        env:
          MANAGER_DIGEST: ${{ needs.image.outputs.manager-digest }}
          LINT_DIGEST: ${{ needs.image.outputs.lint-digest }}
        run: make release-check-images VERSION="${VERSION}"
      # No module or build cache in a publishing job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The components pin the image by the digest just pushed, as
      # `make release` does, so they never follow a moved tag. GoReleaser
      # (pinned in the Makefile) builds tfcapi-lint from the tag.
      # The digest comes through the matrix's merged outputs; refuse
      # anything but a digest rather than pin the components to "<repo>@".
      - name: Build the release assets
        env:
          DIGEST: ${{ needs.image.outputs.manager-digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no manager image digest from the image job: '${DIGEST}'"
            exit 1
          fi
          make release-assets VERSION="${VERSION}" RELEASE_IMG="${IMAGE}@${DIGEST}"
      - name: Attest the release assets
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/release/*
      # Uploaded with the assets, for verifiers without the attestations API.
      - name: Add the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "${BUNDLE}" out/release/provenance.intoto.jsonl
      # The notes quote the image digests the image job pushed.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANAGER_DIGEST: ${{ needs.image.outputs.manager-digest }}
          LINT_DIGEST: ${{ needs.image.outputs.lint-digest }}
        run: make release-github VERSION="${VERSION}"
