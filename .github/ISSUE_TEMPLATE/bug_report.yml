name: Bug report
description: Something in CAPTF does not work as documented.
labels: [kind/bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security vulnerability, do not open an
        issue: use a private security advisory (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including the object's conditions and events (`kubectl describe`).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest Cluster, TerraformCluster/TerraformMachine spec and module that shows it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Manager and Job logs
      description: Relevant manager log lines and the runner Job's log. Remove credentials and state contents.
      render: text
  - type: input
    id: captf-version
    attributes:
      label: CAPTF version or commit
    validations:
      required: true
  - type: input
    id: capi-version
    attributes:
      label: Cluster API version
  - type: input
    id: runtime
    attributes:
      label: Terraform or OpenTofu version
  - type: input
    id: kubernetes
    attributes:
      label: Management cluster Kubernetes version
