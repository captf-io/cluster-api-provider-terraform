# ClusterClass "noop": a kubeadm control plane and one worker class on
# infrastructure the TerraformCluster and TerraformMachine modules create.
# The images and the identity are variables patched onto the Terraform
# templates, so one class serves every tenant and never bakes in a tenant's
# identity. Patches set only source.image; the runtime path is fixed by the
# image contract.
#
# Like every ClusterClass file it has no clusterctl variables and no
# namespaces:
#
#   kubectl apply -n team-a -f clusterclass-noop.yaml
#
# The templates' images are placeholders under the .invalid domain: a
# missing patch fails the pull instead of running anything.
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: noop
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: TerraformClusterTemplate
      name: noop
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: noop-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: TerraformMachineTemplate
        name: noop-control-plane
    # A longer window than workers: replacing a control-plane machine is
    # costlier, and control-plane boot (kubeadm init/join plus kube-vip)
    # does strictly more work than a worker join.
    healthCheck:
      checks:
        nodeStartupTimeoutSeconds: 1800
        unhealthyMachineConditions:
        - type: InfrastructureReady
          status: "False"
          timeoutSeconds: 3600
  workers:
    machineDeployments:
    - class: default-worker
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: noop-worker
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
          kind: TerraformMachineTemplate
          name: noop-worker
      # InfrastructureReady=False starts at apply start, so the timeout must
      # exceed apply time plus one drift interval (default 30m).
      healthCheck:
        checks:
          nodeStartupTimeoutSeconds: 1200
          unhealthyMachineConditions:
          - type: InfrastructureReady
            status: "False"
            timeoutSeconds: 1800
  variables:
  - name: identityName
    required: true
    schema:
      openAPIV3Schema:
        type: string
        minLength: 1
        description: Name of the TerraformClusterIdentity the cluster and, by default, its machines use.
  - name: clusterImage
    required: true
    schema:
      openAPIV3Schema:
        type: string
        minLength: 1
        description: Source image of the cluster module (TerraformCluster spec.source.image).
  - name: machineImage
    required: true
    schema:
      openAPIV3Schema:
        type: string
        minLength: 1
        description: Source image of the machine module, for control-plane and worker machines. Changing it rolls the machines out.
  patches:
  - name: identity
    description: The identity on the TerraformCluster and as its machines' default.
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: TerraformClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/identityRef
        valueFrom:
          template: |
            name: {{ .identityName }}
      - op: add
        path: /spec/template/spec/defaults
        valueFrom:
          template: |
            identityRef:
              name: {{ .identityName }}
  - name: clusterImage
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: TerraformClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/source/image
        valueFrom:
          variable: clusterImage
  - name: machineImage
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: TerraformMachineTemplate
        matchResources:
          controlPlane: true
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: replace
        path: /spec/template/spec/source/image
        valueFrom:
          variable: machineImage
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: TerraformClusterTemplate
metadata:
  name: noop
spec:
  template:
    spec:
      source:
        image: example.invalid/captf/set-by-clusterclass:unset
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: noop-control-plane
spec:
  template:
    spec:
      # A module that fails deterministically must not replace machines
      # forever (cp-kubeadm.md K9).
      remediation:
        maxRetry: 3
        retryPeriodSeconds: 300
      rollout:
        strategy:
          rollingUpdate:
            maxSurge: 0
      kubeadmConfigSpec:
        # Equal to the Cluster's clusterNetwork.apiServerPort (6443).
        initConfiguration:
          localAPIEndpoint:
            bindPort: 6443
        joinConfiguration:
          controlPlane:
            localAPIEndpoint:
              bindPort: 6443
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: TerraformMachineTemplate
metadata:
  name: noop-control-plane
spec:
  template:
    spec:
      source:
        image: example.invalid/captf/set-by-clusterclass:unset
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: TerraformMachineTemplate
metadata:
  name: noop-worker
spec:
  template:
    spec:
      source:
        image: example.invalid/captf/set-by-clusterclass:unset
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: noop-worker
spec:
  template:
    spec: {}
