# CRDs for the seven v1 kinds. The bases are generated by `make manifests`;
# never edit them. Labels and patches are applied here instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CAPI contract label: CAPI resolves the infrastructure API version for the
# v1beta2 contract from this label.
labels:
- pairs:
    cluster.x-k8s.io/v1beta2: v1alpha1

resources:
- bases/infrastructure.cluster.x-k8s.io_terraformclusters.yaml
- bases/infrastructure.cluster.x-k8s.io_terraformclustertemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_terraformmachines.yaml
- bases/infrastructure.cluster.x-k8s.io_terraformmachinetemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_terraformmachinepools.yaml
- bases/infrastructure.cluster.x-k8s.io_terraformmachinepooltemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_terraformclusteridentities.yaml

patches:
# clusterctl move: identities are cluster-scoped and move with the hierarchy
# of the objects that reference them.
- path: patches/move-hierarchy_terraformclusteridentities.yaml
