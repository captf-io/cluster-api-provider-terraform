# Serve admission webhooks from the cert-manager issued certificate.
# controller-runtime reads it from its default directory, so no
# --webhook-cert-dir argument is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      volumes:
      - name: cert
        secret:
          # Not prefixed: the Secret is created by cert-manager, not kustomize.
          secretName: captf-webhook-service-cert
