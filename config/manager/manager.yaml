# The one Namespace of the provider; config/default renames it captf-system.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-api-provider-terraform
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-api-provider-terraform
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cluster-api-provider-terraform
  # Two replicas: every validating webhook is failurePolicy: Fail, so a
  # restart or a node drain of a lone manager would block CAPI's writes to
  # every Terraform* object. The webhook server does not need leader
  # election (controller-runtime's DefaultServer.NeedLeaderElection is
  # false), so the standby serves admission while the leader reconciles and
  # takes over when the leader releases the Lease on shutdown.
  replicas: 2
  # Never drop below the desired count during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: cluster-api-provider-terraform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Prefer, never require, a separate node per replica, so a single-node
      # (kind) cluster still schedules both.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            control-plane: controller-manager
            app.kubernetes.io/name: cluster-api-provider-terraform
      containers:
      - name: manager
        command:
        - /manager
        # clusterctl never injects --namespace; the manager watches all
        # namespaces by default.
        args:
        - --leader-elect
        - --diagnostics-address=:8443
        - --insecure-diagnostics=false
        - --webhook-port=9443
        image: controller:latest
        env:
        # The runner image defaults to the manager's own image. The value is
        # replaced with the built image by config/default.
        - name: CAPTF_MANAGER_IMAGE
          value: controller:latest
        # The webhook lets only the manager's own ServiceAccount set
        # TerraformMachine.spec.providerID.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The Go runtime's soft memory limit follows the container limit
        # (resources.limits.memory, in bytes), so a patched limit carries
        # over: the garbage collector works harder near the limit instead of
        # the kernel killing the pod.
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: manager
              resource: limits.memory
        - name: SERVICE_ACCOUNT_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        ports:
        - containerPort: 9440
          name: healthz
          protocol: TCP
        - containerPort: 8443
          name: metrics
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        # Memory, an estimate to be revised with measurements. The informers
        # hold Secrets without their data, so the steady state is the Go
        # runtime, the CAPI and CAPTF objects and the Job informer: about
        # 50-80Mi. A reconcile reads a state's payload only when it changed
        # (state.CachingReader), at most 4 at a time: up to 32 chunks and
        # 16Mi decompressed each (state.MaxChunks, MaxStateBytes), about
        # 50Mi held while one is decoded, so about 200Mi for the worst case;
        # the parsed outputs kept are bounded at 64Mi (MaxCachedBytes), and
        # real states are 1-5Mi. 512Mi covers the steady state, the cache
        # and the worst-case reads; request enough for the steady state
        # with headroom, so the scheduler is not told to reserve the burst.
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 128Mi
        # The endpoint is removed from the webhook Service while the pod
        # terminates, but kube-proxy and the API server learn that a moment
        # after SIGTERM; waiting keeps admission requests off a pod that has
        # stopped listening. 5s of the 30s grace period, then up to the
        # manager's 20s graceful shutdown (options.GracefulShutdownTimeout).
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        terminationMessagePolicy: FallbackToLogsOnError
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
