# At most one manager replica is voluntarily disrupted at a time (a node
# drain, an eviction), so one replica always serves the failurePolicy: Fail
# webhooks. maxUnavailable, not minAvailable: a single-replica install
# (replicas patched to 1) must stay drainable.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-api-provider-terraform
    app.kubernetes.io/managed-by: kustomize
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cluster-api-provider-terraform
