# Lets Prometheus read /metrics: the manager checks the scraper's token with
# a TokenReview and this permission with a SubjectAccessReview. The subject
# is kube-prometheus's default; edit it for another Prometheus.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: captf-metrics-reader
  labels:
    cluster.x-k8s.io/provider: infrastructure-terraform
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: captf-metrics-reader
  labels:
    cluster.x-k8s.io/provider: infrastructure-terraform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: captf-metrics-reader
subjects:
- kind: ServiceAccount
  name: prometheus-k8s
  namespace: monitoring
