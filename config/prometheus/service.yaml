# The diagnostics endpoint (--diagnostics-address=:8443, container port
# "metrics"). It serves HTTPS and needs a bearer token with RBAC for
# nonResourceURLs /metrics (rbac.yaml).
apiVersion: v1
kind: Service
metadata:
  name: captf-controller-manager-metrics
  namespace: captf-system
  labels:
    app.kubernetes.io/name: cluster-api-provider-terraform
    app.kubernetes.io/component: metrics
    cluster.x-k8s.io/provider: infrastructure-terraform
spec:
  ports:
  - name: metrics
    port: 8443
    protocol: TCP
    targetPort: metrics
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-api-provider-terraform
    cluster.x-k8s.io/provider: infrastructure-terraform
