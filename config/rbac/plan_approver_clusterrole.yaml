# The right to approve a TerraformPlan: update on terraformplans (the
# webhook then requires approvedBy to be the caller). It is deliberately
# NOT aggregated into edit or admin: bind it, with a RoleBinding in the
# namespace of the plans, only to the users who may authorize a destructive
# apply. Combine it with viewer-role (aggregated into view) for read access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plan-approver-role
rules:
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - terraformplans
  verbs:
  - get
  - list
  - watch
  - update
  - patch
