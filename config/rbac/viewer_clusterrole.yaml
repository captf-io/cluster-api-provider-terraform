# Read access to every CAPTF kind, aggregated into the built-in view, edit
# and admin ClusterRoles (edit and admin include view). Includes
# terraformplans and the cluster-scoped TerraformClusterIdentity, which a
# namespaced binding cannot reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: viewer-role
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - terraformclusters
  - terraformclustertemplates
  - terraformmachines
  - terraformmachinetemplates
  - terraformmachinepools
  - terraformmachinepooltemplates
  - terraformclusteridentities
  - terraformplans
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - terraformclusters/status
  - terraformclustertemplates/status
  - terraformmachines/status
  - terraformmachinetemplates/status
  - terraformmachinepools/status
  - terraformclusteridentities/status
  - terraformplans/status
  verbs:
  - get
